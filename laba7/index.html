<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Лабораторна робота 7. Робота з JavaScript функціями</h1>

    <h2>Завдання 1. Сума або різниця</h2>
    <p>Введіть числа через кому:</p>
    <input type="text" id="numbers" placeholder="Наприклад: 1, 2, 3">
    <button onclick="task1()">Обчислити</button>
    <p id="result1"></p>

    <h2>Завдання 2. Факторіал</h2>
    <p>Введіть ціле число:</p>
    <input type="number" id="factorialNumber" placeholder="Наприклад: 5">
    <button onclick="task2()">Обчислити</button>
    <p id="result2"></p>

    <h2>Завдання 3. Числа Фібоначчі</h2>
    <p>Введіть номер числа:</p>
    <input type="number" id="fibNumber" placeholder="Наприклад: 5">
    <button onclick="task3()">Обчислити</button>
    <p id="result3"></p>

    <script src="script.js"></script>
</body>
</html>
